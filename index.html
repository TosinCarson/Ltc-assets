<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asset Library — Learn to Cut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<meta name="color-scheme" content="light dark">
<script>
/* Applied before first paint so a stored choice never flashes the other theme.
   No stored value = light. The OS preference is intentionally ignored. */
(function(){
  try{
    var t = localStorage.getItem('ltc-theme');
    if(t==='light'||t==='dark') document.documentElement.setAttribute('data-theme',t);
  }catch(e){}
})();
</script>
<style>
/* ── tokens ─────────────────────────────────────
   Monochrome. Light is the default for everyone —
   the OS setting is deliberately NOT followed. Dark
   applies only when the user picks it, via
   [data-theme] on <html>, which persists.           */
:root{
  color-scheme:light;
  --canvas:#FFFFFF; --surface:#F7F6F5; --raised:#F0EFED;
  --line:#DEDCD8; --line-soft:#EBE9E6;
  --text:#16161A; --muted:#5D5C5A; --faint:#918F8B;
  --accent:#16161A; --accent-hover:#33323A; --accent-soft:#8B8985;
  --accent-glow:rgba(22,22,26,.06); --on-accent:#FFFFFF;
  --scrim:rgba(22,22,26,.34);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --rail:264px;
  --bar:66px; /* real height of .searchbar, re-measured by syncBar() */
}
:root[data-theme="light"]{
  color-scheme:light;
  --canvas:#FFFFFF; --surface:#F7F6F5; --raised:#F0EFED;
  --line:#DEDCD8; --line-soft:#EBE9E6;
  --text:#16161A; --muted:#5D5C5A; --faint:#918F8B;
  --accent:#16161A; --accent-hover:#33323A; --accent-soft:#8B8985;
  --accent-glow:rgba(22,22,26,.06); --on-accent:#FFFFFF;
  --scrim:rgba(22,22,26,.34);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --canvas:#0B0B0C; --surface:#141416; --raised:#1B1B1E;
  --line:#2B2B30; --line-soft:#1F1F23;
  --text:#EDEBE8; --muted:#8A8886; --faint:#5C5A58;
  --accent:#EDEBE8; --accent-hover:#FFFFFF; --accent-soft:#6A6865;
  --accent-glow:rgba(237,235,232,.08); --on-accent:#0B0B0C;
  --scrim:rgba(0,0,0,.64);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--canvas);color:var(--text);
  font-family:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
::selection{background:var(--accent);color:var(--on-accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}

/* ── header ─────────────────────────────────── */
header{
  border-bottom:1px solid var(--line);background:var(--canvas);
  padding:22px 28px 18px;display:flex;align-items:flex-end;
  gap:20px;flex-wrap:wrap;
}
.brand .eyebrow{
  font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;
  color:var(--faint);margin-bottom:5px;
}
.brand h1{
  font-weight:500;font-size:27px;line-height:1.05;letter-spacing:-.025em;
}
/* belt and braces: nothing on this site renders italic, including any <em> or <i>
   that finds its way into future markup */
em,i,cite,address,dfn,var{font-style:normal}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.tally{font-size:11px;color:var(--faint);letter-spacing:.04em;text-align:right}
.tally b{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.btn{
  background:var(--accent);border:1px solid var(--accent);color:var(--on-accent);
  padding:9px 17px;border-radius:2px;cursor:pointer;font-size:12px;
  font-weight:500;letter-spacing:.05em;text-transform:uppercase;
  transition:background .15s,border-color .15s;white-space:nowrap;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
}
.btn svg{
  width:13px;height:13px;flex:none;fill:none;stroke:currentColor;
  stroke-width:2;stroke-linecap:round;
}
.btn:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--muted)}
.btn.ghost:hover{border-color:var(--muted);color:var(--text);background:transparent}

/* ── theme toggle ───────────────────────────── */
.icon-btn{
  background:transparent;border:1px solid var(--line);border-radius:2px;
  width:34px;height:34px;display:grid;place-items:center;cursor:pointer;
  color:var(--muted);transition:border-color .15s,color .15s;flex:none;
}
.icon-btn:hover{border-color:var(--muted);color:var(--text)}
.icon-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
/* show the sun in dark mode, the moon in light mode */
.icon-btn .i-sun{display:none}
:root[data-theme="dark"] .icon-btn .i-sun{display:block}
:root[data-theme="dark"] .icon-btn .i-moon{display:none}

/* ── search ─────────────────────────────────── */
.searchbar{
  position:sticky;top:0;z-index:30;background:var(--canvas);
  border-bottom:1px solid var(--line);padding:14px 28px;
  display:flex;gap:12px;align-items:center;
}
.search-wrap{position:relative;flex:1;max-width:640px}
.search-wrap svg{
  position:absolute;left:13px;top:50%;transform:translateY(-50%);
  width:14px;height:14px;stroke:var(--faint);fill:none;stroke-width:1.6;
}
#q{
  width:100%;background:var(--surface);border:1px solid var(--line);
  border-radius:2px;padding:10px 14px 10px 36px;font-size:13.5px;
  transition:border-color .15s;
}
#q:focus{border-color:var(--accent);outline:none}
#q::placeholder{color:var(--faint)}
select.sort{
  background:var(--surface);border:1px solid var(--line);border-radius:2px;
  padding:10px 12px;font-size:12px;color:var(--muted);cursor:pointer;
  /* pushes the sort and the view toggle to the right edge, so they line up
     under Add asset in the header instead of trailing the search field */
  margin-left:auto;
}
#railToggle{display:none}

/* list / grid switch */
.seg{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden;flex:none}
.seg-btn{
  background:transparent;border:none;padding:0 11px;height:38px;
  display:grid;place-items:center;cursor:pointer;color:var(--faint);
  transition:background .15s,color .15s;
}
.seg-btn+.seg-btn{border-left:1px solid var(--line)}
.seg-btn:hover{color:var(--text)}
.seg-btn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}

/* ── layout ─────────────────────────────────── */
.shell{display:grid;grid-template-columns:var(--rail) 1fr;align-items:start}
.rail{
  border-right:1px solid var(--line);padding:24px 20px 60px;
  position:sticky;top:var(--bar);max-height:calc(100dvh - var(--bar));overflow-y:auto;
}
.rail-done{display:none}
.rail::-webkit-scrollbar,.results::-webkit-scrollbar{width:7px}
.rail::-webkit-scrollbar-thumb,.results::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
/* ── collapsible filter groups ──────────────── */
.grp{border-bottom:1px solid var(--line-soft)}
.grp summary{
  display:grid;grid-template-columns:1fr auto auto;gap:9px;align-items:center;
  list-style:none;cursor:pointer;padding:13px 0;user-select:none;
}
.grp summary::-webkit-details-marker{display:none}
.grp summary::marker{content:""}
.grp summary .lbl{
  font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--faint);font-weight:500;
}
.grp[open] summary .lbl{color:var(--muted)}
.grp summary:hover .lbl{color:var(--text)}
/* pinned open on desktop: no chevron, nothing to click, label reads as a heading */
.grp.pinned summary{cursor:default;pointer-events:none}
.grp.pinned .chev{display:none}
.grp.pinned summary .lbl{color:var(--muted)}
.grp .chev{
  width:13px;height:13px;fill:none;stroke:var(--faint);stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .2s;
}
.grp[open] .chev{transform:rotate(180deg)}
/* count of active filters, so a collapsed group still declares itself */
.grp .badge{
  display:none;place-items:center;font-family:var(--mono);font-size:9px;
  min-width:16px;height:16px;padding:0 4px;border-radius:8px;
  background:var(--accent);color:var(--on-accent);
}
.grp .badge.on{display:grid}
.grp-bd{padding:2px 0 17px}
.rail-ft{padding:18px 0 0}

/* the pillar spine that used to live here moved to the tab strip above the grid */

/* source list — where an asset physically lives */
.sources{display:flex;flex-direction:column;gap:1px}
.src-row{
  display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;
  padding:7px 8px;width:100%;text-align:left;cursor:pointer;
  background:none;border:1px solid transparent;border-radius:2px;
  transition:background .15s,border-color .15s;
}
.src-row .code{
  font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--faint);
  border:1px solid var(--line);border-radius:2px;padding:2px 4px;
}
.src-row .nm{font-size:12.5px;color:var(--muted);transition:color .15s}
.src-row .ct{font-family:var(--mono);font-size:10.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.src-row:hover{background:var(--surface)}
.src-row:hover .nm{color:var(--text)}
.src-row[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.src-row[aria-pressed="true"] .nm,
.src-row[aria-pressed="true"] .ct{color:var(--on-accent)}
.src-row[aria-pressed="true"] .code{color:var(--on-accent);border-color:var(--on-accent);opacity:.55}
/* declared but still empty: visible as a slot, clearly not yet somewhere to go */
.src-row.unused{cursor:default;opacity:.4}
.src-row.unused:hover{background:none;border-color:transparent}

/* pillar tabs — the browse-by-theme axis. One at a time, never combined. */
.srctabs{
  display:flex;gap:2px;align-items:center;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
  border-bottom:1px solid var(--line-soft);
  padding:4px 0 0;
  /* Without this the strip's full laid-out width becomes the column's minimum,
     since a flex item defaults to min-width:auto. The column would then push past
     the viewport and overflow-x:auto here would never engage. */
  min-width:0;
}
.srctabs::-webkit-scrollbar{display:none}
.src-tab{
  display:inline-flex;align-items:baseline;gap:7px;flex:none;
  padding:7px 12px 9px;cursor:pointer;white-space:nowrap;
  background:none;border:none;border-bottom:2px solid transparent;
  color:var(--muted);font-size:12.5px;
  transition:color .15s,border-color .15s;
}
.src-tab .ct{
  font-family:var(--mono);font-size:10px;color:var(--faint);
  font-variant-numeric:tabular-nums;transition:color .15s;
}
.src-tab:hover{color:var(--text)}
.src-tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.src-tab[aria-selected="true"] .ct{color:var(--muted)}
.src-tab.unused{opacity:.38;cursor:default}
.src-tab.unused:hover{color:var(--muted)}

.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{
  border:1px solid var(--line);background:transparent;color:var(--muted);
  padding:4px 9px;border-radius:2px;font-size:11px;cursor:pointer;
  transition:.15s;letter-spacing:.02em;
}
.chip:hover{border-color:var(--muted);color:var(--text)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip .n{font-family:var(--mono);font-size:9.5px;opacity:.62;margin-left:5px}
/* flags read as outlined rather than solid, so they stay
   distinguishable from value filters without using colour */
.chip.flag[aria-pressed="true"]{
  background:var(--accent-glow);border-color:var(--accent);
  color:var(--text);box-shadow:inset 0 0 0 1px var(--accent);
}
#clearAll{
  background:none;border:none;color:var(--faint);font-size:11px;cursor:pointer;
  text-decoration:underline;text-underline-offset:3px;padding:0;
}
#clearAll:hover{color:var(--accent)}

/* ── results ────────────────────────────────── */
.results{padding:6px 28px 80px;min-height:60vh;min-width:0}
/* Picking a different pillar swaps the whole set in one go, which reads as a jump.
   A short fade and rise on the container makes the change legible. Deliberately on
   the container and not on each card: staggering 200 cards would jank on a phone. */
#list.swap{animation:listIn .26s cubic-bezier(.2,.7,.2,1)}
@keyframes listIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.resbar{
  display:flex;align-items:baseline;gap:10px;padding:14px 2px 10px;
  border-bottom:1px solid var(--line-soft);margin-bottom:4px;
}
.resbar .n{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.resbar .lbl{font-size:11px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}

.row{
  display:grid;grid-template-columns:2px 74px 1fr auto;gap:0 14px;
  align-items:center;padding:12px 8px 12px 0;width:100%;
  background:none;border:none;border-bottom:1px solid var(--line-soft);
  text-align:left;cursor:pointer;transition:background .13s;
}
.row:hover{background:var(--surface)}
.row .tick{
  align-self:stretch;background:var(--line-soft);border-radius:2px;
  transition:background .15s;
}
.row:hover .tick{background:var(--accent)}
.row.untagged .tick{background:transparent;border-left:1px dashed var(--line)}
.row .rid{
  font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.02em;
}
.row .main{min-width:0}
.row .ttl{
  font-size:13.5px;line-height:1.35;margin-bottom:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.row .ttl .star{color:var(--accent);font-size:11px;margin-right:5px;vertical-align:1px}
.row .meta{
  font-size:11px;color:var(--faint);display:flex;flex-wrap:wrap;
  gap:0 7px;align-items:center;
}
.row .meta span{white-space:nowrap}
.row .meta .sep{color:var(--line);}
.row .right{display:flex;align-items:center;gap:8px;justify-self:end}
.stat{
  font-family:var(--mono);font-size:11px;color:var(--muted);
  font-variant-numeric:tabular-nums;text-align:right;min-width:52px;
}
.stat small{display:block;font-size:8.5px;color:var(--faint);letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
.tag{
  font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  border:1px solid var(--line);color:var(--faint);padding:3px 7px;
  border-radius:2px;white-space:nowrap;
}
.tag.hold{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tag.ever{border-color:var(--accent-soft);color:var(--accent)}

/* ── grid view ──────────────────────────────── */
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));
  gap:24px 18px;padding-top:16px;
}
.card{
  display:flex;flex-direction:column;gap:9px;width:100%;
  background:none;border:none;padding:0;text-align:left;cursor:pointer;
}
.thumb{
  position:relative;aspect-ratio:16/9;overflow:hidden;
  background:var(--raised);border:1px solid var(--line-soft);border-radius:2px;
  display:grid;place-items:center;transition:border-color .15s;
}
.card:hover .thumb{border-color:var(--muted)}
.card.untagged .thumb{border-style:dashed;border-color:var(--line)}
.thumb img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;display:block;
}
.thumb img.failed{display:none} /* reveals the placeholder underneath */
/* Carousels are 4:5 Instagram portraits. A 16:9 tile keeps only a band across the
   middle, which on a text-led cover is the one thing you cannot afford to lose.
   `contain` rather than `cover` so a cover that is not exactly 4:5 letterboxes
   against the tile instead of being cropped anyway. */
.card.is-carousel .thumb{aspect-ratio:4/5}
.card.is-carousel .thumb img{object-fit:contain}

/* Logos are transparent PNGs in both black and white artwork, so neither the light
   nor the dark surface can show them all: a white mark vanishes on light, a black
   one on dark. A fixed mid-grey checkerboard is legible for both and is the
   conventional signal that the file has an alpha channel. Deliberately NOT
   theme-aware, since the point is that it sits between the two. */
.card.is-logo .thumb,.panel-thumb.is-logo{
  background-color:#8C8C8C;
  background-image:
    linear-gradient(45deg,rgba(0,0,0,.10) 25%,transparent 25%,transparent 75%,rgba(0,0,0,.10) 75%),
    linear-gradient(45deg,rgba(0,0,0,.10) 25%,transparent 25%,transparent 75%,rgba(0,0,0,.10) 75%);
  background-size:18px 18px;
  background-position:0 0,9px 9px;
  border-color:var(--line);
}
/* contain plus padding: a logo must never be cropped, and it needs breathing room */
.card.is-logo .thumb img,.panel-thumb.is-logo img{object-fit:contain;padding:11%}
.card.is-logo .ph,.panel-thumb.is-logo .ph{color:#2A2A2A}
.card.is-logo .ph .code{border-color:rgba(0,0,0,.3)}
/* placeholder for anything with no derivable image */
.ph{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--faint)}
.ph .code{
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  border:1px solid var(--line);border-radius:2px;padding:3px 6px;
}
.ph .lbl{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase}
.thumb .dur,.thumb .star{
  position:absolute;background:var(--canvas);border:1px solid var(--line);
  border-radius:2px;padding:2px 5px;
}
.thumb .dur{right:6px;bottom:6px;font-family:var(--mono);font-size:9.5px;color:var(--muted)}
.thumb .star{left:6px;top:6px;font-size:10px;color:var(--text);line-height:1.2}
.card .ttl{
  font-size:12.5px;line-height:1.36;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.card .meta{font-size:10.5px;color:var(--faint);display:flex;flex-wrap:wrap;gap:0 6px}
.card .meta span{white-space:nowrap}
.card .meta .sep{color:var(--line)}
.card .tags{display:flex;flex-wrap:wrap;gap:5px}

.empty{padding:64px 8px;max-width:420px}
.empty p{font-size:17px;font-weight:500;letter-spacing:-.015em;color:var(--text);margin-bottom:8px}
.empty small{color:var(--faint);font-size:12.5px;line-height:1.6;display:block}

/* ── panel ──────────────────────────────────── */
.scrim{
  position:fixed;inset:0;background:var(--scrim);z-index:60;
  opacity:0;pointer-events:none;transition:opacity .22s;
}
.scrim.on{opacity:1;pointer-events:auto}
.panel{
  position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);
  background:var(--surface);border-left:1px solid var(--line);z-index:70;
  transform:translateX(101%);transition:transform .28s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;
}
.panel.on{transform:none}
.panel-hd{
  padding:20px 26px;border-bottom:1px solid var(--line);
  display:flex;align-items:flex-start;gap:14px;
}
.panel-hd .pid{font-family:var(--mono);font-size:10.5px;color:var(--accent);letter-spacing:.06em;margin-bottom:7px}
.panel-hd h3{
  font-weight:500;font-size:18px;line-height:1.3;letter-spacing:-.018em;
}
.x{
  background:none;border:none;color:var(--faint);font-size:22px;
  cursor:pointer;line-height:1;padding:2px 4px;margin-left:auto;
}
.x:hover{color:var(--text)}
.panel-bd{padding:22px 26px 40px;overflow-y:auto;flex:1}
.panel-ft{
  padding:16px 26px;border-top:1px solid var(--line);
  display:flex;gap:10px;background:var(--surface);
}
.panel-ft .btn{flex:1;text-align:center}

/* hero thumbnail at the top of the detail drawer */
.panel-thumb{
  position:relative;aspect-ratio:16/9;overflow:hidden;margin-bottom:22px;
  background:var(--raised);border:1px solid var(--line-soft);border-radius:2px;
  display:grid;place-items:center;
}
.panel-thumb img{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;display:block;
}
.panel-thumb img.failed{display:none}
/* same reasoning as the card: the drawer is where you go to actually read a cover */
.panel-thumb.is-carousel{aspect-ratio:4/5}
.panel-thumb.is-carousel img{object-fit:contain}

dl.facts{display:grid;grid-template-columns:110px 1fr;gap:0}
dl.facts dt{
  font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
  padding:11px 0;border-bottom:1px solid var(--line-soft);
}
dl.facts dd{padding:11px 0;border-bottom:1px solid var(--line-soft);font-size:13px;word-break:break-word}
/* the faint colour alone marks an empty value, no italic anywhere on this site */
dl.facts dd.none{color:var(--faint)}
dl.facts dd a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-glow)}
dl.facts dd a:hover{border-bottom-color:var(--accent)}
.notebox{
  margin-top:22px;padding:15px 17px;background:var(--raised);
  border-left:2px solid var(--accent);font-size:13px;line-height:1.6;color:var(--muted);
}
.alert{
  margin-bottom:20px;padding:12px 15px;border:1px solid var(--accent);
  background:var(--accent-glow);font-size:12.5px;line-height:1.55;
}
.alert b{display:block;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:5px}

/* ── form ───────────────────────────────────── */
.field{margin-bottom:17px}
.field label{
  display:block;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint);margin-bottom:7px;
}
.field input,.field select,.field textarea{
  width:100%;background:var(--canvas);border:1px solid var(--line);
  border-radius:2px;padding:9px 11px;font-size:13px;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none}
.field textarea{resize:vertical;min-height:74px;line-height:1.55}
.field .hint{font-size:11px;color:var(--faint);margin-top:6px;line-height:1.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.err{color:var(--accent);font-size:11.5px;margin-top:6px;display:none}
.err.on{display:block}

.toast{
  position:fixed;bottom:26px;left:50%;transform:translate(-50%,80px);
  background:var(--accent);color:var(--on-accent);padding:11px 22px;border-radius:2px;
  font-size:12.5px;letter-spacing:.04em;z-index:90;opacity:0;
  transition:.26s cubic-bezier(.4,0,.2,1);pointer-events:none;
}
.toast.on{transform:translate(-50%,0);opacity:1}

/* ── responsive ─────────────────────────────── */

/* very wide: cap list rows so lines stay scannable, but let the grid
   use the full width — capping it just strands whitespace on the right */
@media (min-width:1600px){
  .results:not(.is-grid){max-width:1180px}
  .is-grid .grid{grid-template-columns:repeat(auto-fill,minmax(238px,1fr))}
}

/* laptop: tighten the rail before it starts squeezing the list */
@media (max-width:1180px){
  :root{--rail:224px}
  header,.searchbar,.results{padding-left:20px;padding-right:20px}
  .rail{padding:22px 16px 60px}
}

/* tablet and below: rail becomes a full-screen sheet */
@media (max-width:880px){
  header{padding:16px 18px 13px;gap:14px}
  .brand h1{font-size:23px}
  .tally{font-size:10.5px}
  .searchbar{padding:12px 18px;gap:10px;flex-wrap:wrap}
  .search-wrap{max-width:none;flex:1 1 100%;order:-1} /* search on its own line, above the controls */
  /* auto margin here and nowhere else on the row, so the hamburger collects all the
     free space and lands hard right against the title. .hdr-right has to give up its
     own auto margin or flexbox splits the gap between the two. */
  #railToggle{display:grid;margin-left:auto}
  .hdr-right{margin-left:0}
  /* the Filters button used to occupy the left of this row. With it promoted to the
     header, the sort's auto margin just left a gap where it had been, so let the
     sort take that space instead and keep the view toggle pinned right. */
  select.sort{margin-left:0;flex:1}
  .shell{grid-template-columns:1fr}
  /* A left drawer rather than a full-screen takeover, so the grid stays visible
     behind it and the scrim reads as "tap here to dismiss". Slides on transform,
     which is why display stays block: display:none cannot animate. z-index sits
     above the scrim (60) and below the detail panel (70). */
  .rail{
    position:fixed;top:0;bottom:0;left:0;right:auto;z-index:65;
    width:min(84vw,320px);background:var(--canvas);
    border-right:1px solid var(--line);max-height:none;overflow-y:auto;
    display:block;padding:0 18px 90px;
    transform:translateX(-100%);visibility:hidden;
    transition:transform .28s cubic-bezier(.2,.7,.2,1),visibility .28s;
  }
  .rail.open{transform:none;visibility:visible}
  .rail-done{
    display:flex;position:sticky;top:0;z-index:2;background:var(--canvas);
    align-items:center;justify-content:space-between;gap:12px;
    padding:16px 0 14px;margin-bottom:6px;border-bottom:1px solid var(--line);
  }
  .rail-done .ttl{font-size:13px;font-weight:500;letter-spacing:-.01em}
  .grp:first-of-type{border-top:none}
  .results{padding:6px 18px 80px}
  .row{grid-template-columns:2px 1fr;gap:0 12px}
  .row .rid{display:none}
  .row .right{grid-column:2;justify-self:start;margin-top:8px}
  .two{grid-template-columns:1fr}
  .panel-hd,.panel-ft{padding-left:20px;padding-right:20px}
  .panel-bd{padding:20px 20px 40px}
}

/* phone */
@media (max-width:560px){
  header{padding:14px 15px 12px;gap:12px}
  .brand h1{font-size:21px}
  .hdr-right{gap:9px;width:100%;margin-left:0}
  .tally{order:3;margin-left:auto;text-align:right}
  .searchbar{padding:11px 15px}
  .results{padding:6px 15px 72px}
  .rail{padding:0 15px 90px}
  .row .ttl{font-size:13px}
  .row .meta{font-size:10.5px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(142px,1fr));gap:18px 12px}
  .card .ttl{font-size:12px}
  dl.facts{grid-template-columns:96px 1fr}
  dl.facts dt{font-size:9px;letter-spacing:.12em}
  .panel-ft{flex-wrap:wrap}
  .panel-ft .btn{flex:1 1 100%}
}

/* coarse pointers get larger hit targets */
@media (pointer:coarse){
  .chip{padding:7px 11px;font-size:11.5px}
  .src-row{padding-top:10px;padding-bottom:10px}
  .src-tab{padding-top:9px;padding-bottom:11px}
  .icon-btn{width:38px;height:38px}
}

/* ── splash ─────────────────────────────────────
   Shows on every load, holds ~4.2s, then clears.
   The hide is a CSS animation rather than JS so a
   script error can never trap anyone behind it.   */
.splash{
  position:fixed;inset:0;z-index:200;overflow:hidden;
  background:#000;display:grid;place-items:center;
  /* without this the figure's screen blend reaches past the splash and
     composites against the library underneath */
  isolation:isolate;
  /* everything has settled by ~2.4s, so the hold ends right after rather than
     sitting on a static frame for another second */
  animation:splashOut .55s cubic-bezier(.4,0,.2,1) 2.95s forwards;
}
.splash.skip{animation:splashOut .3s cubic-bezier(.4,0,.2,1) forwards}
@keyframes splashOut{to{opacity:0;visibility:hidden;pointer-events:none}}

.splash-stage{position:absolute;inset:0}
/* The source photo is a lit marble figure on a near-black field. Screen blend
   drops that field out against our black, so the statue reads as cut out and
   can pass IN FRONT of the wordmark without any masking. */
.splash-figure{
  position:absolute;left:50%;bottom:0;height:112vh;width:auto;max-width:none;
  mix-blend-mode:screen;filter:grayscale(1) contrast(1.05);
  /* feathers the photo's rectangle away so only the lit figure reads */
  -webkit-mask-image:radial-gradient(ellipse 60% 72% at 50% 66%, #000 42%, transparent 100%);
  mask-image:radial-gradient(ellipse 60% 72% at 50% 66%, #000 42%, transparent 100%);
  opacity:0;transform:translateX(-50%) translateY(34px) scale(1.05);
  animation:spFig 2.25s cubic-bezier(.16,.72,.16,1) .12s forwards;
}
@keyframes spFig{to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}

/* logo and caption as one centred stack, so the caption can never ride up
   into the monogram whatever the logo scales to */
.splash-mark{
  position:absolute;left:50%;top:27%;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:18px;
}
.splash-word{
  width:min(185px,36vw);
  opacity:0;transform:translateY(14px);
  animation:spWord 1s cubic-bezier(.2,.7,.2,1) .7s forwards;
}
@keyframes spWord{to{opacity:1;transform:translateY(0)}}
.splash-cap{
  font-size:9px;letter-spacing:.44em;text-transform:uppercase;color:#8A8886;
  opacity:0;animation:spFade .8s ease 1.45s forwards;
}
/* deepens the edges so the figure emerges from black rather than sitting on it */
.splash-vig{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 78% 62% at 50% 46%, transparent 0%, rgba(0,0,0,.55) 62%, #000 100%);
}
.splash-skip{
  position:absolute;bottom:34px;left:0;right:0;text-align:center;
  font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:#55524E;
  opacity:0;animation:spFade .7s ease 1.9s forwards;
}
@keyframes spFade{to{opacity:1}}

/* architecture draws itself in, then the two forms travel */
.sp-col{opacity:0;transform:translateY(16px);animation:spRise .95s cubic-bezier(.2,.7,.2,1) .15s forwards}
@keyframes spRise{to{opacity:1;transform:none}}
.sp-arch{stroke-dasharray:1000;stroke-dashoffset:1000;animation:spDraw 1.5s cubic-bezier(.35,.6,.2,1) .55s forwards}
@keyframes spDraw{to{stroke-dashoffset:0}}
.sp-line{opacity:0;animation:spFade .9s ease .55s forwards}
/* the whole point: they decelerate hard and stop short of each other */
.sp-reach-l{transform:translateX(-190px);animation:spReachL 2.4s cubic-bezier(.1,.72,.12,1) .95s forwards}
.sp-reach-r{transform:translateX(190px);animation:spReachR 2.4s cubic-bezier(.1,.72,.12,1) .95s forwards}
@keyframes spReachL{to{transform:translateX(0)}}
@keyframes spReachR{to{transform:translateX(0)}}
.sp-spark{opacity:0;animation:spSpark 1.7s ease 2.55s forwards}
@keyframes spSpark{0%{opacity:0}45%{opacity:1}100%{opacity:.6}}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  /* splash shows fully formed, holds briefly, then still clears itself */
  .splash *{opacity:1!important;transform:none!important}
  .sp-arch{stroke-dashoffset:0!important}
  .splash{animation:splashOut .4s ease 1.6s forwards!important}
}
</style>

<script>
/* The CSS animation is what actually hides the splash, so it clears even if
   anything below throws. This only adds skip-on-input and removes the node
   afterwards so it can never intercept a click. */
(function(){
  var s = document.getElementById('splash');
  if(!s) return;
  var gone = false;
  function drop(){
    if(gone) return; gone = true;
    s.classList.add('skip');
    setTimeout(function(){ s.remove(); }, 340);
  }
  s.addEventListener('click', drop);
  addEventListener('keydown', drop, {once:true});
  setTimeout(function(){ if(!gone){ gone = true; s.remove(); } }, 3700);
})();
</script>

/* ── storage ────────────────────────────────────────────────
   Supabase, spoken to over plain fetch against PostgREST rather than the JS SDK,
   so this stays a single file with no library to load.

   SEED above is still the offline fallback. If the network is down or the key is
   wrong, rebuild() falls back to it and the catalogue opens read-only instead of
   empty. storageOnline records which of those two happened.

   The anon key is public by design: it ships inside this file. Row level security
   grants read, insert and update but not delete, so a leaked key cannot empty the
   table. Keep this file private anyway.                                          */
const SUPABASE_URL      = 'https://vmqggyulrngmjtgqvlrm.supabase.co';   // https://xxxxxxxx.supabase.co
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZtcWdneXVscm5nbWp0Z3F2bHJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0NzQyMjQsImV4cCI6MjA5NjA1MDIyNH0.D7-EtwbZ2UpqkOPEn7plAZABfnW5IBPbtjm9T7UOMNI';      // eyJhbGciOi...

const SB = () => `${SUPABASE_URL}/rest/v1/assets`;
const sbHeaders = () => ({
  apikey: SUPABASE_ANON_KEY,
  Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
  'Content-Type': 'application/json',
});
const sbConfigured = () => !SUPABASE_URL.startsWith('PASTE_');
let storageOnline = false;

async function loadOverlay(){
  if(!sbConfigured()){
    console.warn('Supabase not configured yet - showing the built-in seed only.');
    return {};
  }
  // A refused connection rejects fast, but a black-holed one (offline captive portal,
  // DNS timeout) can hang forever. Without this, boot would wait on it indefinitely
  // and the catalogue would never render.
  const ctrl = new AbortController();
  const bail = setTimeout(() => ctrl.abort(), 8000);
  try{
    const r = await fetch(`${SB()}?select=*`, {headers: sbHeaders(), signal: ctrl.signal});
    if(!r.ok) throw new Error(`${r.status} ${await r.text()}`);
    const rows = await r.json();
    storageOnline = true;
    return Object.fromEntries(rows.map(row => [row.id, row]));
  }catch(e){
    storageOnline = false;
    console.warn('Supabase unavailable, falling back to the built-in seed:', e.message);
    return {};
  }finally{
    clearTimeout(bail);
  }
}

/* One row per asset, so saving an asset touches only that asset. Two people editing
   different records at the same time no longer overwrite each other, which a
   whole-blob write could not avoid. */
async function saveAsset(rec){
  if(!sbConfigured()) return false;
  try{
    // the form leaves views as '' on non-video assets; the column is bigint
    const body = {...rec, views: (rec.views === '' || rec.views == null) ? null : Number(rec.views)};
    const r = await fetch(`${SB()}?on_conflict=id`, {
      method: 'POST',
      headers: {...sbHeaders(), Prefer: 'resolution=merge-duplicates,return=minimal'},
      body: JSON.stringify(body),
    });
    if(!r.ok) throw new Error(`${r.status} ${await r.text()}`);
    storageOnline = true;
    return true;
  }catch(e){
    console.error('Supabase save failed:', e.message);
    return false;
  }
}

let overlay = {};
let assets = [];
function rebuild(){
  const byId = new Map(SEED.map(a => [a.id, a]));
  for(const [id, rec] of Object.entries(overlay)) byId.set(id, {...(byId.get(id)||{}), ...rec});
  assets = [...byId.values()];
}

/* ── state ─────────────────────────────────── */
const PILLARS = ['The Craft','The Climb','The Proof','The Playbook','The Classroom','Inside LTC'];
const FIELDS = {funnel:'f-funnel', rights:'f-rights', status:'f-status', type:'f-type',
                category:'f-category', location:'f-location'};

/* Source is derived from the ID prefix, not stored on the record —
   the prefix already encodes where the asset lives. Order here is
   the order shown in the rail. */
const SOURCES = [
  ['YT','YouTube'], ['MS','Model shoot'], ['TS','Testimonials'], ['BR','B-roll'], ['CR','Carousel'],
  ['EB','Ebook'], ['PR','Presentation'], ['PD','Pitch deck'],
  ['PH','Photo'], ['LG','Logo'], ['DS','Design'],
];
const SRC_NAME = Object.fromEntries(SOURCES);
const srcOf = a => String(a.id||'').split('-')[0] || '';

const state = {q:'', sort:'id', view:'list', source:new Set(), pillar:new Set(), funnel:new Set(),
               rights:new Set(), status:new Set(), type:new Set(), category:new Set(),
               location:new Set(), flags:new Set()};
const FLAGS = {
  star:   {label:'Best performer', test:a=>a.star},
  hold:   {label:'Permission pending', test:a=>a.rights==='Student - permission pending'},
  // neither link, not just no published one — raw footage was never posted anywhere,
  // so testing `link` alone would flag all 83 source-only records as broken
  nolink: {label:'Missing link', test:a=>!a.link && !a.files},
  untag:  {label:'Untagged', test:a=>!a.pillar},
};

const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtViews = v => v==null ? '' : v>=1000 ? (v/1000).toFixed(v>=10000?0:1).replace(/\.0$/,'')+'k' : String(v);

function matches(a){
  if(state.source.size && !state.source.has(srcOf(a))) return false;
  // __untagged is a pseudo-pillar for "no pillar set", so the tab strip can offer it
  if(state.pillar.size){
    const p = (a.pillar || '').trim();
    const want = state.pillar.has('__untagged') ? !p : state.pillar.has(p);
    if(!want) return false;
  }
  for(const f of Object.keys(FIELDS)) if(state[f].size && !state[f].has(a[f])) return false;
  for(const f of state.flags) if(!FLAGS[f].test(a)) return false;
  if(state.q){
    const hay = [a.id,a.title,a.notes,a.category,a.location,a.usedIn,a.pillar,a.type,a.quality,
                 SRC_NAME[srcOf(a)]]
      .join(' ').toLowerCase();
    if(!state.q.toLowerCase().split(/\s+/).every(t => hay.includes(t))) return false;
  }
  return true;
}
function sortFn(a,b){
  switch(state.sort){
    case 'views':  return (b.views??-1)-(a.views??-1);
    case 'posted': return (b.posted||'').localeCompare(a.posted||'');
    case 'title':  return a.title.localeCompare(b.title);
    default:       return a.id.localeCompare(b.id);
  }
}

/* ── collapsible groups ─────────────────────────
   Open/closed is remembered per group, so someone who
   works mostly in Source and Pillar keeps the rest shut. */
const GRP_KEY = 'ltc-rail-groups';
function loadGroups(){
  try{ return JSON.parse(localStorage.getItem(GRP_KEY)) || {}; }catch(e){ return {}; }
}
/* Source is the primary navigation, so on desktop it is pinned open: there is room
   for it and collapsing it hides the main way around the library. The drawer on a
   phone is tight, so it stays collapsible there. Enforced in JS because `open` is an
   attribute and CSS cannot force a <details> open. */
const SOURCE_PINNED = () => innerWidth > 880;
function pinSourceGroup(){
  const d = document.querySelector('.grp[data-grp="source"]');
  if(!d) return;
  const pinned = SOURCE_PINNED();
  d.classList.toggle('pinned', pinned);
  if(pinned && !d.open) d.open = true;
}

function initGroups(){
  const saved = loadGroups();
  document.querySelectorAll('.grp').forEach(d => {
    if(d.dataset.grp in saved) d.open = !!saved[d.dataset.grp];
    d.addEventListener('toggle', () => {
      // a pinned group that somehow closes springs straight back
      if(d.dataset.grp === 'source' && SOURCE_PINNED() && !d.open){ d.open = true; return; }
      const s = loadGroups();
      s[d.dataset.grp] = d.open;
      try{ localStorage.setItem(GRP_KEY, JSON.stringify(s)); }catch(e){}
    });
  });
  pinSourceGroup();
}
function renderBadges(){
  document.querySelectorAll('.grp').forEach(d => {
    const n = state[d.dataset.grp] ? state[d.dataset.grp].size : 0;
    const b = d.querySelector('.badge');
    // The badge exists so a COLLAPSED group can still say it is filtering something.
    // A pinned group is always open and its selection is highlighted right below the
    // heading, so the count only repeats what is already on screen, and a lone digit
    // beside a heading reads as an unread notification rather than a filter count.
    const pinned = d.classList.contains('pinned');
    b.textContent = n && !pinned ? n : '';
    b.classList.toggle('on', n > 0 && !pinned);
  });
}

/* Source rows in the rail. One at a time, with an All row on top: an asset lives in
   exactly one place, so combining sources was never meaningful. */
function renderSources(){
  const counts = {};
  for(const a of assets){ const s = srcOf(a); if(s) counts[s] = (counts[s]||0)+1; }
  const known = SOURCES.map(([c])=>c);
  // Every declared source is listed, empty or not, so the rail stays the
  // catalogue's full vocabulary: you can see a slot exists before anything fills it.
  const codes = [
    ...known,
    ...Object.keys(counts).filter(c => !known.includes(c)).sort(),
  ];
  const row = (code, label, n, on, dead) => `
    <button class="src-row${dead ? ' unused' : ''}" data-src="${esc(code)}"
            aria-pressed="${on}"${dead ? ' disabled' : ''}>
      <span class="code">${esc(code || '·')}</span>
      <span class="nm">${esc(label)}</span>
      <span class="ct">${n}</span>
    </button>`;

  $('#sources').innerHTML =
    row('', 'All sources', assets.length, state.source.size === 0, false) +
    codes.map(c => row(c, SRC_NAME[c] || c, counts[c] || 0, state.source.has(c), !counts[c])).join('');
}

/* Pillar tabs above the grid. Same one-at-a-time rule as source: an asset has a
   single pillar, so combining them was never meaningful. */
function renderPillarTabs(){
  /* Counts are scoped to the selected source, not the whole library. Otherwise a tab
     advertises 48 while the source you are in holds none of them, and clicking it
     lands on "Nothing matches that". Scoped counts make an impossible combination
     visibly unavailable instead of a dead end you discover by falling into it. */
  const inScope = state.source.size
    ? assets.filter(a => state.source.has(srcOf(a)))
    : assets;
  const counts = {};
  for(const a of inScope){ const p = (a.pillar || '').trim(); if(p) counts[p] = (counts[p]||0)+1; }
  const names = [
    ...PILLARS,
    ...Object.keys(counts).filter(p => !PILLARS.includes(p)).sort(),
  ];
  const tab = (name, label, n, on) => `
    <button class="src-tab${n === 0 ? ' unused' : ''}" role="tab" data-pillar="${esc(name)}"
            aria-selected="${on}"${n === 0 ? ' disabled' : ''}>
      <span class="nm">${esc(label)}</span><span class="ct">${n}</span>
    </button>`;

  const untagged = inScope.filter(a => !(a.pillar || '').trim()).length;
  // No All tab here: "All sources" in the rail already covers the reset, and
  // clicking the selected pillar again clears it.
  $('#pilltabs').innerHTML =
    names.map(p => tab(p, p, counts[p] || 0, state.pillar.has(p))).join('') +
    // surfaced as a tab because with nothing tagged it is otherwise invisible
    (untagged ? tab('__untagged', 'Untagged', untagged, state.pillar.has('__untagged')) : '');
}

function renderRail(){
  renderSources();
  renderPillarTabs();

  for(const [field,id] of Object.entries(FIELDS)){
    const vals = [...new Set(assets.map(a=>a[field]).filter(Boolean))].sort();
    $('#'+id).innerHTML = vals.map(v=>{
      const n = assets.filter(a=>a[field]===v).length;
      const cls = v==='Student - permission pending' ? 'chip flag' : 'chip';
      const lbl = v.replace('Student - permission pending','Permission pending')
                   .replace('Guest - collab cleared','Guest cleared')
                   .replace('Video - ','');
      return `<button class="${cls}" data-field="${field}" data-val="${esc(v)}"
        aria-pressed="${state[field].has(v)}">${esc(lbl)}<span class="n">${n}</span></button>`;
    }).join('');
  }
  $('#f-flags').innerHTML = Object.entries(FLAGS).map(([k,f])=>{
    const n = assets.filter(f.test).length;
    return `<button class="chip flag" data-flag="${k}" aria-pressed="${state.flags.has(k)}">
      ${f.label}<span class="n">${n}</span></button>`;
  }).join('');

  /* A group with nothing in it is noise, not vocabulary: unlike Source, these are
     values observed in the data rather than a declared set, so an empty Rights group
     is not a slot waiting to be filled, it is a heading over nothing. It reappears
     the day the first record uses it. A group holding an active filter is never
     hidden, or the filter would still apply with no way to see or clear it. */
  document.querySelectorAll('.grp[data-grp]').forEach(d => {
    const field = d.dataset.grp;
    if(field === 'source') return;              // pinned nav, always shown
    const body = d.querySelector('.grp-bd');
    if(!body) return;
    const hasValues = body.children.length > 0 && body.firstElementChild.children.length > 0;
    const inUse = state[field] && state[field].size > 0;
    d.hidden = !hasValues && !inUse;
  });

  renderBadges();
  $('#tallyN').textContent = assets.length;
  const hold = assets.filter(FLAGS.hold.test).length;
  $('#tallyHold').textContent = hold ? hold+' need permission' : 'all cleared';
}

/* ── thumbnails ─────────────────────────────────
   A record can carry an explicit `thumb` URL. Failing
   that, YouTube links yield one from the video id.
   Everything else falls back to a placeholder tile.  */
function ytId(url){
  const m = String(url||'').match(/[?&]v=([A-Za-z0-9_-]{6,})/);
  return m ? m[1] : '';
}
function thumbOf(a){
  if(a.thumb) return a.thumb;
  const y = ytId(a.link);
  return y ? `https://img.youtube.com/vi/${y}/mqdefault.jpg` : '';
}
/* Type as well as source: a carousel published straight to Instagram carries an IG
   id, so the prefix alone would miss it and crop the cover. */
const isCarousel = a => srcOf(a) === 'CR' || a.type === 'Carousel';
const isLogo     = a => srcOf(a) === 'LG' || a.type === 'Logo';

/* the tile shown when no image resolves — shared by grid and drawer */
function phHTML(a){
  const code = srcOf(a);
  return `<span class="ph">
    <span class="code">${esc(code)}</span>
    <span class="lbl">${esc(SRC_NAME[code] || 'Asset')}</span>
  </span>`;
}

function tagsOf(a){
  const tags = [];
  if(a.rights==='Student - permission pending') tags.push('<span class="tag hold">Permission</span>');
  if(a.status==='Evergreen pool') tags.push('<span class="tag ever">Evergreen</span>');
  else if(a.status && a.status!=='Active') tags.push(`<span class="tag">${esc(a.status)}</span>`);
  return tags;
}
const joinMeta = m => m.map(x=>`<span>${esc(x)}</span>`).join('<span class="sep">·</span>');

/* ── render: rows ───────────────────────────── */
function rowHTML(a){
  const meta = [
    SRC_NAME[srcOf(a)] || srcOf(a),
    a.category, a.pillar, a.funnel, a.location,
    a.duration && a.duration+' min', a.posted && a.posted.slice(0,7)
  ].filter(Boolean);
  return `<button class="row${a.pillar?'':' untagged'}" data-id="${esc(a.id)}">
    <span class="tick"></span>
    <span class="rid">${esc(a.id)}</span>
    <span class="main">
      <span class="ttl">${a.star?'<span class="star">★</span>':''}${esc(a.title)}</span>
      <span class="meta">${joinMeta(meta)}</span>
    </span>
    <span class="right">${tagsOf(a).join('')}${a.views!=null?`<span class="stat">${fmtViews(a.views)}<small>views</small></span>`:''}</span>
  </button>`;
}

/* ── render: cards ──────────────────────────── */
function cardHTML(a){
  const src = thumbOf(a);
  const meta = [a.category, a.pillar, a.views!=null ? fmtViews(a.views)+' views' : ''].filter(Boolean);
  return `<button class="card${a.pillar?'':' untagged'}${isCarousel(a)?' is-carousel':''}${isLogo(a)?' is-logo':''}" data-id="${esc(a.id)}">
    <span class="thumb">
      ${phHTML(a)}
      ${src?`<img src="${esc(src)}" alt="" loading="lazy" decoding="async">`:''}
      ${a.star?'<span class="star">★</span>':''}
      ${a.duration?`<span class="dur">${esc(a.duration)}</span>`:''}
    </span>
    <span class="ttl">${esc(a.title)}</span>
    <span class="meta">${joinMeta(meta)}</span>
    ${tagsOf(a).length?`<span class="tags">${tagsOf(a).join('')}</span>`:''}
  </button>`;
}

function renderList(){
  const out = assets.filter(matches).sort(sortFn);
  $('#count').textContent = out.length;
  $('#countLbl').textContent = out.length===assets.length ? 'assets' : `of ${assets.length} assets`;

  const host = $('#list');
  const results = document.querySelector('.results');
  if(!out.length){
    host.className = '';
    results.classList.remove('is-grid');
    host.innerHTML = `<div class="empty"><p>Nothing matches that.</p>
      <small>Try fewer filters, or search a looser term. The index covers titles, notes,
      sources, categories and locations.</small></div>`;
    return;
  }
  const grid = state.view==='grid';

  /* Carousels are 4:5 where everything else is 16:9, so one of them in the top row
     leaves its neighbours with a block of dead space under them. Sink them.
     Only under 'id', and only in the grid:
     - 'id' order is arbitrary anyway (CR leads because C precedes E and Y), so
       rearranging it costs nothing you asked for. Views, posted and title are
       orderings you explicitly chose, and a layout tweak must not quietly
       contradict the dropdown: a carousel that IS the most viewed still leads.
     - the list has uniform row heights, so there is no problem there to fix.
     sort() is stable, so ID order survives inside each group. */
  if(grid && state.sort === 'id'){
    out.sort((a,b) => (isCarousel(a)?1:0) - (isCarousel(b)?1:0));
  }

  host.className = grid ? 'grid' : '';
  results.classList.toggle('is-grid', grid);
  host.innerHTML = out.map(grid ? cardHTML : rowHTML).join('');
}

function setView(v){
  state.view = v==='grid' ? 'grid' : 'list';
  try{ localStorage.setItem('ltc-view', state.view); }catch(e){}
  document.querySelectorAll('.seg-btn').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.view===state.view)));
  renderList();
}

/* ── panel ──────────────────────────────────── */
function openPanel(html){
  $('#panel').innerHTML = html; $('#panel').classList.add('on'); $('#scrim').classList.add('on');
  document.body.style.overflow='hidden';
  const f = $('#panel').querySelector('input,textarea,select,button'); f && f.focus();
}
function closePanel(){
  $('#panel').classList.remove('on');
  // the drawer shares the scrim, so only clear it if the drawer is not still open
  if(!$('#rail').classList.contains('open')) $('#scrim').classList.remove('on');
  document.body.style.overflow='';
}
function fact(label,val,link){
  const empty = !val;
  const body = empty ? 'Not recorded'
    : link ? `<a href="${esc(val)}" target="_blank" rel="noopener">${esc(val.replace(/^https?:\/\//,''))}</a>`
    : esc(val);
  return `<dt>${label}</dt><dd class="${empty?'none':''}">${body}</dd>`;
}
function showAsset(id){
  const a = assets.find(x=>x.id===id); if(!a) return;
  const hold = a.rights==='Student - permission pending';
  const src = thumbOf(a);
  openPanel(`
    <div class="panel-hd">
      <div><div class="pid">${esc(a.id)}</div><h3>${a.star?'<span style="color:var(--accent)">★</span> ':''}${esc(a.title)}</h3></div>
      <button class="x" data-close aria-label="Close">×</button>
    </div>
    <div class="panel-bd">
      <div class="panel-thumb${isCarousel(a)?' is-carousel':''}${isLogo(a)?' is-logo':''}">
        ${phHTML(a)}
        ${src?`<img src="${esc(src)}" alt="" decoding="async">`:''}
      </div>
      ${hold?`<div class="alert"><b>Clear before publishing</b>Rights are marked student, permission pending. Confirm with the student before this goes into an edit or a post.</div>`:''}
      <dl class="facts">
        ${fact('Source',SRC_NAME[srcOf(a)]||srcOf(a))}
        ${fact('Pillar',a.pillar)}${fact('Category',a.category)}${fact('Funnel use',a.funnel)}
        ${fact('Asset type',a.type)}${fact('Status',a.status)}${fact('Rights',a.rights)}
        ${fact('Quality',a.quality)}${fact('Duration',a.duration)}
        ${fact('Views',a.views!=null?a.views.toLocaleString():'')}
        ${fact('Posted',a.posted)}${fact('Location',a.location)}${fact('Used in',a.usedIn)}
        ${fact('Published link',a.link,true)}${fact('Source files',a.files,true)}${fact('Added',a.added)}
      </dl>
      ${a.notes?`<div class="notebox">${esc(a.notes)}</div>`:''}
    </div>
    <div class="panel-ft">
      ${a.link?`<a class="btn" style="text-decoration:none" href="${esc(a.link)}" target="_blank" rel="noopener">Open asset</a>`:''}
      ${a.files?`<a class="btn ghost" style="text-decoration:none" href="${esc(a.files)}" target="_blank" rel="noopener">Source files</a>`:''}
      <button class="btn ghost" data-edit="${esc(a.id)}">Edit details</button>
    </div>`);
}

const SEL = {
  pillar:['',...PILLARS],
  funnel:['','Attract','Position','Nurture'],
  type:['','Video - long-form','Video - short/raw','Photo','Screenshot','Ebook / PDF','Carousel','Presentation','Pitch deck','Logo','Design asset'],
  status:['','Active','Evergreen pool','In edit','Archived'],
  rights:['','Owned','Guest - collab cleared','Student - permission pending'],
  quality:['','High','Medium','Low','Raw / Unreviewed'],
};
function opts(name,cur){
  const extra = [...new Set(assets.map(a=>a[name]).filter(Boolean))].filter(v=>!SEL[name].includes(v));
  return [...SEL[name],...extra].map(v=>
    `<option value="${esc(v)}"${v===(cur||'')?' selected':''}>${v?esc(v):'—'}</option>`).join('');
}
function nextId(prefix){
  const n = assets.filter(a=>a.id.startsWith(prefix+'-'))
    .map(a=>parseInt(a.id.slice(prefix.length+1),10)||0);
  return prefix+'-'+String((n.length?Math.max(...n):0)+1).padStart(3,'0');
}
function showForm(id){

  const isNew = !id;
  openPanel(`
    <div class="panel-hd">

      <button class="x" data-close aria-label="Close">×</button>
    </div>
    <div class="panel-bd">

        <input id="f_title" value="${esc(a.title||'')}" placeholder="What is this asset?">

      ${isNew?`<div class="two">
        <div class="field"><label>ID prefix</label>

            /* generated from SOURCES so a new source can never go missing here again */
            SOURCES.map(([c,n])=>`<option value="${esc(c)}">${esc(c)} · ${esc(n)}</option>`).join('')
          }</select>
          <div class="hint">ID assigned on save: <b id="idPrev">—</b></div></div>
        <div class="field"><label>Published link</label><input id="f_link" placeholder="https://"></div>
      </div>`:`<div class="field"><label>Published link</label><input id="f_link" value="${esc(a.link||'')}" placeholder="https://"></div>`}
      <div class="field"><label>Source files</label>
        <input id="f_files" value="${esc(a.files||'')}" placeholder="https://">
        <div class="hint">Where the working files live: Frame.io for footage, Drive for carousel
          and design files. The link above is where it went live publicly.</div></div>
      <div class="field"><label>Thumbnail URL</label>
        <input id="f_thumb" value="${esc(a.thumb||'')}" placeholder="https://">
        <div class="hint">Optional. YouTube assets pull their own thumbnail automatically.
          Set this for Frame.io and anything else you want pictured in grid view.</div></div>
      <div class="two">
        <div class="field"><label>Pillar</label><select id="f_pillar">${opts('pillar',a.pillar)}</select></div>

      </div>
      <div class="two">
        <div class="field"><label>Asset type</label><select id="f_type">${opts('type',a.type)}</select></div>
        <div class="field"><label>Category</label><input id="f_category" value="${esc(a.category||'')}" list="cats" placeholder="e.g. Haircut Tutorial"></div>
      </div>
      <div class="two">
        <div class="field"><label>Rights</label><select id="f_rights">${opts('rights',a.rights)}</select>
          <div class="hint">Mark student footage as permission pending until it's confirmed.</div></div>
        <div class="field"><label>Status</label><select id="f_status">${opts('status',a.status)}</select></div>
      </div>
      <div class="two">
        <div class="field"><label>Quality</label><select id="f_quality">${opts('quality',a.quality)}</select></div>
        <div class="field"><label>Location</label><input id="f_location" value="${esc(a.location||'')}" placeholder="City or shoot"></div>
      </div>
      <div class="two">
        <div class="field"><label>Duration</label><input id="f_duration" value="${esc(a.duration||'')}" placeholder="12:30"></div>

      </div>
      <div class="field"><label>Notes</label>
        <textarea id="f_notes" placeholder="Why this asset matters, what it feeds, anything the next person needs.">${esc(a.notes||'')}</textarea></div>
      <datalist id="cats">${[...new Set(assets.map(x=>x.category).filter(Boolean))].sort()
        .map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
    </div>
    <div class="panel-ft">
      <button class="btn" data-save="${isNew?'':esc(a.id)}">${isNew?'Add to library':'Save changes'}</button>
      <button class="btn ghost" data-close>Cancel</button>
    </div>`);
  if(isNew){
    const upd = () => $('#idPrev').textContent = nextId($('#f_prefix').value);
    $('#f_prefix').addEventListener('change', upd); upd();

function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2600);
}
async function save(existingId){
  const title = $('#f_title').value.trim();
  if(!title){ $('#e_title').classList.add('on'); $('#f_title').focus(); return; }
  const id = existingId || nextId($('#f_prefix').value);
  const rec = {
    id, title,
    link:$('#f_link').value.trim(), files:$('#f_files').value.trim(),
    thumb:$('#f_thumb').value.trim(),
    pillar:$('#f_pillar').value, funnel:$('#f_funnel').value,
    type:$('#f_type').value, category:$('#f_category').value.trim(), rights:$('#f_rights').value,
    status:$('#f_status').value, quality:$('#f_quality').value, location:$('#f_location').value.trim(),
    duration:$('#f_duration').value.trim(), posted:$('#f_posted').value, notes:$('#f_notes').value.trim(),
    views: existingId ? (assets.find(a=>a.id===existingId)||{}).views ?? null : null,
    star: existingId ? !!(assets.find(a=>a.id===existingId)||{}).star : false,
    usedIn: existingId ? (assets.find(a=>a.id===existingId)||{}).usedIn || '' : '',
    added: existingId ? (assets.find(a=>a.id===existingId)||{}).added || todayISO() : todayISO(),
  };
  overlay[id] = rec;
  // render immediately from the local overlay, then report whether it actually landed
  const ok = await saveAsset(rec);
  rebuild(); renderRail(); renderList(); closePanel();
  toast(ok ? (existingId?`${id} updated`:`${id} added to the library`)
           : `${id} saved on this device only, Supabase is unreachable`);
}
const todayISO = () => new Date().toISOString().slice(0,10);

/* ── events ─────────────────────────────────── */
/* ── theme ──────────────────────────────────── */
function currentTheme(){
  // light unless the user has explicitly chosen dark — the OS is not consulted
  return document.documentElement.getAttribute('data-theme') || 'light';
}
function toggleTheme(){
  const next = currentTheme()==='dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('ltc-theme', next); }catch(e){}
}

document.addEventListener('click', e => {
  if(e.target.closest('#themeBtn')){ toggleTheme(); return; }
  const s = e.target.closest('.src-row');
  if(s){
    // Single-select: picking a source replaces the current one rather than adding
    // to it. Clicking the active row, or All sources, goes back to everything.
    const v = s.dataset.src;
    state.source.clear();
    if(v && !s.matches('[aria-pressed="true"]')) state.source.add(v);

    /* Scoped tab counts stop you picking an impossible pair, but a pillar chosen
       BEFORE the source can still be stranded: pick The Craft, then Frame.io, and the
       two intersect to nothing. Drop the pillar only when it would empty the view, so
       a pairing that still returns something (Ebook plus The Classroom) survives. */
    if(state.pillar.size){
      const scoped = state.source.size
        ? assets.filter(a => state.source.has(srcOf(a)))
        : assets;
      const stillMatches = scoped.some(a => {
        const p = (a.pillar || '').trim();
        return state.pillar.has(p) || (state.pillar.has('__untagged') && !p);
      });
      if(!stillMatches) state.pillar.clear();
    }

    renderRail(); renderList(); animateList();
    /* In drawer mode, picking a source is a complete decision, so get out of the way
       and show the result. Filtered first, so the grid is already correct when it is
       revealed. Only source does this: the chips below are multi-select, and closing
       on every tap would mean reopening the drawer between each one. */
    if($('#rail').classList.contains('open')) openRail(false);
    return;
  }
  const p = e.target.closest('.src-tab');
  if(p){
    // same one-at-a-time rule as source
    const v = p.dataset.pillar;
    state.pillar.clear();
    if(v && !p.matches('[aria-selected="true"]')) state.pillar.add(v);
    renderRail(); renderList(); animateList(); return;
  }
  const c = e.target.closest('.chip');
  if(c){
    if(c.dataset.flag){ const k=c.dataset.flag; state.flags.has(k)?state.flags.delete(k):state.flags.add(k); }
    else { const f=c.dataset.field, v=c.dataset.val; state[f].has(v)?state[f].delete(v):state[f].add(v); }
    renderRail(); renderList(); return;
  }
  const vb = e.target.closest('.seg-btn'); if(vb){ setView(vb.dataset.view); return; }
  const r = e.target.closest('.row,.card'); if(r){ showAsset(r.dataset.id); return; }
  // the scrim now serves both the drawer and the detail panel, so it has to know
  // which one it is dismissing
  if(e.target.id==='scrim'){
    if($('#rail').classList.contains('open')) openRail(false); else closePanel();
    return;
  }
  if(e.target.closest('[data-close]')){ closePanel(); return; }
  const ed = e.target.closest('[data-edit]'); if(ed){ showForm(ed.dataset.edit); return; }
  const sv = e.target.closest('[data-save]'); if(sv){ save(sv.dataset.save||null); return; }
  if(e.target.closest('#addBtn')){ showForm(null); return; }
  if(e.target.closest('#railToggle')){ openRail(!$('#rail').classList.contains('open')); return; }
  if(e.target.closest('#railDone')){ openRail(false); return; }
  if(e.target.id==='clearAll'){
    state.q=''; $('#q').value='';
    ['source','pillar','funnel','rights','status','type','category','location','flags'].forEach(k=>state[k].clear());
    renderRail(); renderList(); return;
  }
});
/* A thumbnail that 404s (deleted video, dead link) hides itself
   so the placeholder behind it shows through. `error` doesn't
   bubble, hence the capture phase. */
document.addEventListener('error', e => {
  const img = e.target;
  if(img.tagName==='IMG' && img.closest('.thumb,.panel-thumb')) img.classList.add('failed');
}, true);

/* The tab strip scrolls sideways once the pillars outrun the width, with the bar
   hidden. A trackpad can swipe sideways but a plain mouse only has a vertical wheel,
   which would leave the last few tabs unreachable. Translate one to the other. */
$('#pilltabs').addEventListener('wheel', e => {
  const el = e.currentTarget;
  if(el.scrollWidth <= el.clientWidth) return;           // nothing to scroll
  if(Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;   // already a sideways gesture
  e.preventDefault();
  el.scrollLeft += e.deltaY;
}, {passive:false});

$('#q').addEventListener('input', e => { state.q = e.target.value.trim(); renderList(); });
$('#sort').addEventListener('change', e => { state.sort = e.target.value; renderList(); });
document.addEventListener('keydown', e => {
  if(e.key==='Escape'){ closePanel(); openRail(false); }
  if(e.key==='/' && document.activeElement!==$('#q')){ e.preventDefault(); $('#q').focus(); }
});

/* ── layout sync ────────────────────────────────
   The rail sticks below the search bar, whose height
   changes when the bar wraps. Measure it rather than
   guessing, so nothing hides under the bar.        */
function syncBar(){
  const h = document.querySelector('.searchbar').offsetHeight;
  document.documentElement.style.setProperty('--bar', h+'px');
  // the sheet only exists below 880px — leaving it "open" past that
  // would strand the body scroll lock
  if(innerWidth > 880 && $('#rail').classList.contains('open')) openRail(false);
  // crossing the breakpoint changes whether Source is pinned
  pinSourceGroup();
}
function animateList(){
  const el = $('#list');
  el.classList.remove('swap');
  void el.offsetWidth;   // reflow, so the animation restarts rather than being ignored
  el.classList.add('swap');
}
function openRail(open){
  $('#rail').classList.toggle('open', open);
  // the drawer no longer covers the screen, so it needs the scrim behind it
  $('#scrim').classList.toggle('on', open);
  $('#railToggle').setAttribute('aria-expanded', String(open));
  document.body.style.overflow = open ? 'hidden' : '';
}
addEventListener('resize', syncBar);

(async function init(){
  syncBar(); initGroups();
  let v = 'list';
  try{ v = localStorage.getItem('ltc-view') || 'list'; }catch(e){}
  overlay = await loadOverlay();
  rebuild(); renderRail(); setView(v);
})();
</script>
